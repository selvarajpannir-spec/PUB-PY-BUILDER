name: Delete All Files Except Workflows

on:
  workflow_dispatch:   # Manual trigger only

permissions:
  contents: write

jobs:
  delete-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete all files except .github/workflows
        run: |
          # Keep .git and .github, delete everything else at the root
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          # Inside .github, keep only the workflows folder
          if [ -d ".github" ]; then
            find .github -mindepth 1 -maxdepth 1 \
              ! -name 'workflows' \
              -exec rm -rf {} +
          fi

      - name: Commit and push the deletions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git status

          # Only commit if there are actual changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: delete all files except workflow folder"
            git push
          fi
