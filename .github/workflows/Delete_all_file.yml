name: Delete All Files Except Workflows

on:
  workflow_dispatch:   # Manual trigger only (recommended)
  # Uncomment the lines below if you want it to run on push (dangerous)
  # push:
  #   branches: [ main ]

permissions:
  contents: write

jobs:
  delete-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use a personal access token or the default GITHUB_TOKEN with write permission
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete all files except .github/workflows
        run: |
          # Keep only the .github/workflows folder
          find . -mindepth 1 -maxdepth 1 ! -name '.github' -exec rm -rf {} +
          
          # Inside .github, keep only the workflows folder
          if [ -d ".github" ]; then
            find .github -mindepth 1 -maxdepth 1 ! -name 'workflows' -exec rm -rf {} +
          fi

      - name: Commit and push the deletions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          git commit -m "chore: delete all files except workflow folder" || echo "No changes to commit"
          git push
