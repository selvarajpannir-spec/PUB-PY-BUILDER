name: Build Debug & Unsigned Release APK (Plan A)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name for this build (e.g. 1.5)"
        required: true
        default: "1.0.1"
        type: string
      version_code:
        description: "Version code integer for this build (e.g. 4)"
        required: true
        default: "2"
        type: string

permissions:
  actions: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Show CURRENT version and NEXT version
      run: |
        echo "=============================================="
        if [ -f version.txt ]; then
          CUR_NAME=$(grep -E '^VERSION_NAME=' version.txt | head -1 | cut -d= -f2- | tr -d '\r' | xargs)
          CUR_CODE=$(grep -E '^VERSION_CODE=' version.txt | head -1 | cut -d= -f2- | tr -d '\r' | xargs)
          echo " CURRENT version name : ${CUR_NAME:-unknown}"
          echo " CURRENT version code : ${CUR_CODE:-unknown}"
        else
          echo " CURRENT version      : (version.txt not found — treating as 1.0.0 / 1)"
          CUR_NAME="1.0.0"
          CUR_CODE="1"
        fi
        echo "----------------------------------------------"
        echo " NEXT version name    : ${{ github.event.inputs.version_name }}"
        echo " NEXT version code    : ${{ github.event.inputs.version_code }}"
        echo "=============================================="
        echo "Tip: Keep version.txt in the repo updated so you always know CURRENT before the next run."

    # Keep storage low: delete all artifacts older than the newest few
    - name: Prune old artifacts (keep max 5)
      uses: actions/github-script@v7
      with:
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const keep = 5;
          let page = 1;
          let all = [];
          while (true) {
            const res = await github.rest.actions.listArtifactsForRepo({
              owner, repo, per_page: 100, page
            });
            all = all.concat(res.data.artifacts);
            if (res.data.artifacts.length < 100) break;
            page++;
            if (page > 20) break;
          }
          all.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
          const toDelete = all.slice(keep);
          for (const a of toDelete) {
            try {
              await github.rest.actions.deleteArtifact({
                owner, repo, artifact_id: a.id
              });
              core.info(`Deleted artifact ${a.name} (${a.id})`);
            } catch (e) {
              core.warning(`Skip ${a.id}: ${e.message}`);
            }
          }
          core.info(`Artifacts before=${all.length}, deleted=${toDelete.length}, keep<=${keep}`);

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # ─── PYTHON 3.10 — try multiple methods until one works ───
    - name: Install Python 3.10
      run: |
        echo "=== Trying Method 1: apt install python3.10 ==="
        if sudo apt-get install -y python3.10 python3.10-dev 2>/dev/null && \
           python3.10 --version 2>/dev/null; then
          echo "Method 1 succeeded"
          PYPATH=$(which python3.10)
        else
          echo "Method 1 failed — trying Method 2: deadsnakes PPA"
          sudo apt-get install -y software-properties-common 2>/dev/null
          sudo add-apt-repository -y ppa:deadsnakes/ppa 2>/dev/null
          sudo apt-get update -qq 2>/dev/null
          if sudo apt-get install -y python3.10 python3.10-dev 2>/dev/null && \
             python3.10 --version 2>/dev/null; then
            echo "Method 2 succeeded"
            PYPATH=$(which python3.10)
          else
            echo "Method 2 failed — trying Method 3: pyenv"
            curl https://pyenv.run | bash 2>/dev/null || true
            export PYENV_ROOT="$HOME/.pyenv"
            export PATH="$PYENV_ROOT/bin:$PATH"
            eval "$(pyenv init -)" 2>/dev/null || true
            if pyenv install 3.10.14 2>/dev/null && \
               pyenv global 3.10.14 && \
               python3 --version 2>/dev/null; then
              echo "Method 3 succeeded"
              PYPATH=$(pyenv which python3.10 2>/dev/null || which python3)
            else
              echo "Method 3 failed — trying Method 4: use available python3"
              PYPATH=$(which python3)
              PYVER=$($PYPATH --version 2>&1 | grep -oP '\d+\.\d+' || echo "3.10")
              echo "Using Python $PYVER at $PYPATH"
              echo "PYVER_OVERRIDE=$PYVER" >> $GITHUB_ENV
            fi
          fi
        fi

        if [ -f "$(which python3.10 2>/dev/null)" ]; then
          sudo update-alternatives --install /usr/bin/python3 python3 \
            $(which python3.10) 10 2>/dev/null || true
          sudo update-alternatives --set python3 $(which python3.10) 2>/dev/null || true
          echo "Set python3.10 as default python3"
        fi

        echo "=== Final Python version ==="
        python3 --version
        FINAL_PYPATH=$(which python3)
        FINAL_VER=$(python3 --version 2>&1 | grep -oP '\d+\.\d+' || echo "3.10")
        echo "PYTHON_PATH=$FINAL_PYPATH" >> $GITHUB_ENV
        echo "PYTHON_VER=$FINAL_VER" >> $GITHUB_ENV
        echo "Python ready: $FINAL_PYPATH ($FINAL_VER)"

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    # ─── CREATE PROJECT STRUCTURE ───
    - name: Create project folders
      run: |
        mkdir -p project/app/src/main/java/com/docs/plus
        mkdir -p project/app/src/main/python
        mkdir -p project/app/src/main/res/layout
        mkdir -p project/app/src/main/res/values
        mkdir -p project/app/src/main/res/drawable
        mkdir -p project/app/src/main/res/xml
        mkdir -p project/app/src/main/res/mipmap-mdpi
        mkdir -p project/app/src/main/res/mipmap-hdpi
        mkdir -p project/app/src/main/res/mipmap-xhdpi
        mkdir -p project/app/src/main/res/mipmap-xxhdpi
        mkdir -p project/app/src/main/res/mipmap-xxxhdpi
        mkdir -p project/app/src/main/assets


    - name: Copy Manifest
      run: cp AndroidManifest.xml project/app/src/main/AndroidManifest.xml

    - name: Copy Java files
      run: |
        find . -maxdepth 1 -name "*.java" \
          -exec cp {} project/app/src/main/java/com/docs/plus/ \; || true

    - name: Copy Python files
      run: |
        find . -maxdepth 1 -name "*.py" \
          -exec cp {} project/app/src/main/python/ \; || true

    - name: Ensure file_paths.xml for FileProvider
      run: |
        mkdir -p project/app/src/main/res/xml
        if [ -f "file_paths.xml" ]; then
          cp file_paths.xml project/app/src/main/res/xml/file_paths.xml
          echo "Copied file_paths.xml from repo"
        else
          cat > project/app/src/main/res/xml/file_paths.xml << 'XML'
        <?xml version="1.0" encoding="utf-8"?>
        <paths xmlns:android="http://schemas.android.com/apk/res/android">
            <external-files-path name="external_files" path="." />
            <cache-path name="cache" path="." />
            <files-path name="files" path="." />
            <external-path name="external" path="." />
        </paths>
        XML
          # strip leading indentation from heredoc
          sed -i 's/^        //' project/app/src/main/res/xml/file_paths.xml
          echo "Wrote default file_paths.xml"
        fi
        ls -la project/app/src/main/res/xml/

    - name: Copy Value XMLs
      run: |
        for f in strings.xml colors.xml styles.xml themes.xml dimens.xml attrs.xml; do
          [ -f "$f" ] && cp "$f" project/app/src/main/res/values/ || true
        done

    - name: Copy Asset files
      run: |
        find . -maxdepth 1 \
          \( -name "*.html" -o -name "*.css" -o -name "*.js" \
             -o -name "*.json" -o -name "*.svg" \) \
          -exec cp {} project/app/src/main/assets/ \; || true

    - name: Install ImageMagick and resize icon
      run: |
        sudo apt-get install -y imagemagick
        if [ -f "icon.png" ]; then
          convert icon.png -resize 48x48   project/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert icon.png -resize 72x72   project/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert icon.png -resize 96x96   project/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert icon.png -resize 144x144 project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert icon.png -resize 192x192 project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        else
          convert -size 48x48   xc:#2b6cb0 project/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert -size 72x72   xc:#2b6cb0 project/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert -size 96x96   xc:#2b6cb0 project/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert -size 144x144 xc:#2b6cb0 project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert -size 192x192 xc:#2b6cb0 project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        fi

    # ─── Root project files (written once) ───
    - name: Create root build.gradle, settings.gradle, gradle.properties
      run: |
        cat > project/build.gradle << 'EOF'
        buildscript {
            repositories {
                google()
                mavenCentral()
                maven { url "https://chaquo.com/maven" }
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:9.0.1'
                classpath 'com.chaquo.python:gradle:17.0.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
                maven { url "https://chaquo.com/maven" }
            }
        }
        EOF

        cat > project/settings.gradle << 'EOF'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
                maven { url "https://chaquo.com/maven" }
            }
        }
        dependencyResolutionManagement {
            repositories {
                google()
                mavenCentral()
                maven { url "https://chaquo.com/maven" }
            }
        }
        rootProject.name = "MyApp"
        include ':app'
        EOF

        cat > project/gradle.properties << 'EOF'
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx4096m
        EOF

    # ─── Resilient dependency selection + fallback loop ───
    - name: Write app/build.gradle and resolve Python dependencies with fallback
      run: |
        set -euo pipefail

        # ── App version (from workflow_dispatch, or defaults on push) ──
        VERSION_NAME="${{ github.event.inputs.version_name || '1.0.0' }}"
        VERSION_CODE="${{ github.event.inputs.version_code || '1' }}"
        if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
          echo "ERROR: NEXT version_code must be a positive integer (got: $VERSION_CODE)"
          exit 1
        fi
        # Show CURRENT for info only — do NOT block the build
        if [ -f version.txt ]; then
          CUR_CODE=$(grep -E '^VERSION_CODE=' version.txt | head -1 | cut -d= -f2- | tr -d '\r' | xargs)
          CUR_NAME=$(grep -E '^VERSION_NAME=' version.txt | head -1 | cut -d= -f2- | tr -d '\r' | xargs)
        else
          CUR_CODE="?"
          CUR_NAME="(none)"
        fi
        echo "CURRENT → name=$CUR_NAME code=$CUR_CODE"
        echo "BUILD   → name=$VERSION_NAME code=$VERSION_CODE"
        echo "Building versionName=$VERSION_NAME versionCode=$VERSION_CODE"
        export VERSION_NAME VERSION_CODE

        # Plan A: no signing credentials (unsigned / debug APK only)

        PYVER="${PYVER_OVERRIDE:-3.10}"
        PYPATH="${PYTHON_PATH:-python3}"
        echo "Target Python: $PYVER  |  buildPython: $PYPATH"

        # Ordered candidate dependency sets (most preferred first).
        # Each entry is a newline-separated list of pip requirement lines.
        # Add new sets at the top when a breakage appears.
        DEP_SETS=(
          # Preferred – flexible + Pillow for photo resize
          $'python-docx==1.1.2\nopenpyxl==3.1.2\ndocxcompose>=1.4.1,<3\nPillow>=10.0.0\npypdf>=4.0.0\npypdf>=4.0.0'

          # Exact modern pins
          $'python-docx==1.1.2\nopenpyxl==3.1.2\ndocxcompose==2.2.0\nPillow>=10.0.0\npypdf>=4.0.0\npypdf>=4.0.0'

          # Conservative 1.4.x
          $'python-docx==1.1.2\nopenpyxl==3.1.2\ndocxcompose==1.4.1\nPillow>=10.0.0\npypdf>=4.0.0\npypdf>=4.0.0'

          # Last-resort loose constraints
          $'python-docx>=1.1.0\nopenpyxl>=3.0.0\ndocxcompose>=1.4.0\nPillow>=10.0.0\npypdf>=4.0.0\npypdf>=4.0.0'
        )

        SUCCESS=0
        CHOSEN_INDEX=-1

        for i in "${!DEP_SETS[@]}"; do
          echo ""
          echo "════════════════════════════════════════════════════"
          echo " Trying dependency set #$((i+1)) of ${#DEP_SETS[@]}"
          echo "════════════════════════════════════════════════════"

          # Build the pip { } block
          PIP_BLOCK=""
          while IFS= read -r req; do
            req=$(echo "$req" | xargs)          # trim whitespace
            [[ -z "$req" ]] && continue
            PIP_BLOCK+="                install \"$req\""$'\n'
          done <<< "${DEP_SETS[$i]}"

          # Write app/build.gradle
          cat > project/app/build.gradle << EOF
        plugins {
            id 'com.android.application'
            id 'com.chaquo.python'
        }

        android {
            namespace "com.docs.plus"
            compileSdk 36

            defaultConfig {
                applicationId "com.docs.plus"
                minSdk 26
                targetSdk 36
                versionCode $VERSION_CODE
                versionName "$VERSION_NAME"

                ndk {
                    abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
                }

                python {
                    version "$PYVER"
                    buildPython "$PYPATH"
                    pip {
        $PIP_BLOCK
                    }
                }
            }

            buildTypes {
                release {
                    // Plan A: unsigned release (sign later on phone via APK→AAB converter)
                    minifyEnabled   false
                    shrinkResources false
                }
                debug {
                    minifyEnabled false
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.core:core:1.12.0'
            implementation 'androidx.documentfile:documentfile:1.0.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

          echo "Generated pip block:"
          echo "$PIP_BLOCK"

          # Attempt only the Chaquopy install task (fast failure)
          # We capture output so we can detect pip resolution errors.
          set +e
          cd project
          gradle :app:installReleasePythonRequirements --stacktrace 2>&1 | tee /tmp/chaquo-install.log
          EXIT_CODE=${PIPESTATUS[0]}
          cd ..
          set -e

          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Dependency set #$((i+1)) succeeded"
            SUCCESS=1
            CHOSEN_INDEX=$i
            break
          fi

          # Decide whether this failure is a dependency resolution problem
          if grep -qE "No matching distribution found|Could not find a version that satisfies|ERROR: pip returned exit status" /tmp/chaquo-install.log; then
            echo "⚠️  Dependency resolution failed for set #$((i+1)) – trying next set"
            continue
          else
            echo "❌ Non-dependency error occurred – aborting fallback"
            cat /tmp/chaquo-install.log
            exit $EXIT_CODE
          fi
        done

        if [ $SUCCESS -ne 1 ]; then
          echo "❌ All dependency sets failed. Last log:"
          cat /tmp/chaquo-install.log
          exit 1
        fi

        echo ""
        echo "Using dependency set #$((CHOSEN_INDEX+1)) for the rest of the build"
        echo "Final python { } section:"
        grep -A 30 "python {" project/app/build.gradle || true

    # ─── Full signed builds (dependencies already resolved) ───
    - name: Build Debug APK
      run: cd project && gradle assembleDebug

    - name: Build Unsigned Release APK
      run: cd project && gradle assembleRelease

    - name: List outputs
      run: |
        echo "=== APK outputs ==="
        find project/app/build/outputs -name "*.apk" -type f 2>/dev/null || true

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk-v${{ github.event.inputs.version_name || '1.0.0' }}-c${{ github.event.inputs.version_code || '1' }}
        path: project/app/build/outputs/apk/debug/*.apk
        retention-days: 5
        if-no-files-found: warn

    - name: Upload Unsigned Release APK
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-release-apk-v${{ github.event.inputs.version_name || '1.0.0' }}-c${{ github.event.inputs.version_code || '1' }}
        path: project/app/build/outputs/apk/release/*.apk
        retention-days: 5
        if-no-files-found: warn

    - name: Update version.txt to NEXT (becomes new CURRENT)
      if: success()
      run: |
        {
          echo "# Docs+ app version — CURRENT build numbers"
          echo "# Open this file before each GitHub Action run to see current values."
          echo "# In the workflow form, enter the NEXT version (code must be higher)."
          echo "VERSION_NAME=${{ github.event.inputs.version_name }}"
          echo "VERSION_CODE=${{ github.event.inputs.version_code }}"
        } > version.txt
        echo "Updated version.txt:"
        cat version.txt

    - name: Commit version.txt back to repo
      if: success()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add version.txt
        if git diff --staged --quiet; then
          echo "version.txt unchanged"
        else
          git commit -m "chore: bump version to ${{ github.event.inputs.version_name }} (${{ github.event.inputs.version_code }})"
          git push
        fi
